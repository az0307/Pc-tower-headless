# Dockge Container Manager — Tier 1
# RAM: 192MB | CPU: 0.3
services:
  dockge:
    image: louislam/dockge:0.3.5
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/docker/dockge/data:/app/data
      - ${HOME}/docker:${HOME}/docker
    environment:
      DOCKGE_STACKS_DIR: "${HOME}/docker"
    networks: [proxy]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
