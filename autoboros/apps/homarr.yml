version: "3.9"
# Homarr Dashboard — Tier 1
# RAM: 192MB | CPU: 0.3
services:
  homarr:
    image: ghcr.io/ajnart/homarr:0.15.10
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    volumes:
      - ~/docker/homarr/configs:/app/data/configs
      - ~/docker/homarr/icons:/app/public/icons
      - ~/docker/homarr/data:/data
    networks: [proxy]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
