# Changedetection.io — Tier 3 (Worker Only)
# RAM: 256MB | CPU: 0.5
services:
  changedetection:
    image: dgtlmoon/changedetection.io:0.49.14
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      FETCH_WORKERS: "2"
      PORT: "5000"
    volumes:
      - changedetection_data:/datastore
    ports:
      - "5000:5000"
    networks: [worker]

volumes:
  changedetection_data:

networks:
  worker:
    driver: bridge
