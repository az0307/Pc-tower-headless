version: "3.9"
# Excalidraw Whiteboard — Tier 2
# RAM: 64MB | CPU: 0.1
# Static web app, minimal overhead, E2E encrypted rooms
services:
  excalidraw:
    image: excalidraw/excalidraw:0.18.0
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    networks: [proxy]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
