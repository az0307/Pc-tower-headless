# Vaultwarden Password Vault — Tier 1
# RAM: 192MB | CPU: 0.3
services:
  vaultwarden:
    image: vaultwarden/server:1.36.0
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      # Set VAULTWARDEN_ADMIN_TOKEN to an Argon2id PHC hash, not a plaintext
      # secret. Generate one with:  docker run --rm -it vaultwarden/server /vaultwarden hash
      # Store it in the env file. If it contains literal '$' and you inline it in
      # a compose file instead, escape each '$' as '$$'. Leave unset to disable /admin.
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:-}"
      WEB_VAULT_ENABLED: "true"
      ROCKET_WORKERS: "4"
    volumes:
      - vaultwarden_data:/data
    networks: [proxy]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  vaultwarden_data:

networks:
  proxy:
    external: true
