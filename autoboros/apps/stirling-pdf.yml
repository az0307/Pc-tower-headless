# Stirling-PDF — Tier 3 (Worker Only)
# RAM: 512MB | CPU: 1.0
services:
  stirling-pdf:
    image: frooodle/s-pdf:0.45.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      LANGS: "en_GB"
    volumes:
      - stirling_data:/usr/share/tesseract-ocr/5/tessdata
      - stirling_configs:/configs
    ports:
      - "8081:8080"
    networks: [worker]

volumes:
  stirling_data:
  stirling_configs:

networks:
  worker:
    driver: bridge
